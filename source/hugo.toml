baseURL = "https://panoskarabelas.com/"
locale = "en-US"
defaultContentLanguage = "en"
theme = "hermit-v2"
title = "Panos Karabelas"

copyright = "This work is licensed under a Creative Commons Attribution-NonCommercial 4.0 International License."
enableEmoji = true
enableRobotsTXT = true
rssLimit = 10

# tag and category pages are not used, no post declares them
disableKinds = ["taxonomy", "term"]

[taxonomies]

[markup]
  [markup.goldmark.parser]
    wrapStandAloneImageWithinParagraph = false
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    lineNumbersInTable = false
    tabWidth = 4

[imaging]
  resampleFilter = "Lanczos"
  [imaging.jpeg]
    quality = 84
  [imaging.webp]
    quality = 82

[params]
  tagline = "Rendering & Engine Programmer"
  jobTitle = "Graphics / Engine Programmer"
  description = "Panos Karabelas builds renderers and the engines around them. Creator of Spartan Engine, a bindless GPU-driven engine with real-time path-traced global illumination. Previously AMD, Codemasters and Sony."
  ogImage = "/media/engine/world_showroom_a.png"
  cvURL = "/media/cv.html"
  twitterHandle = "@panoskarabelas"
  footerTagline = "Renderers, engines, and the odd conversation with people worth listening to."
  footerNote = "Hand built. No trackers."

  # current position, shown in the hero status pill and the work timeline
  currentRole = "Graphics / Engine Programmer"
  currentOrg = "BeamNG"

  # canonical external destinations
  engineRepo = "https://github.com/PanosK92/SpartanEngine"
  engineDiscord = "https://discord.gg/TG5r2BS"
  engineSponsor = "https://github.com/sponsors/PanosK92"
  engineTrailer = "TMZ0epSVwCk"
  podcastSpotify = "https://open.spotify.com/show/5F27nWKn9TZdClc5db9efY"
  podcastYoutube = "https://www.youtube.com/@panos_karabelas"

[params.author]
  name = "Panos Karabelas"
  about = "about"

